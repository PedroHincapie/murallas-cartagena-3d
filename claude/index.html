  #ui p{margin:0;color:var(--mut);font-size:12px}
  .lbl-row{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:12px;margin-bottom:4px}
  .lbl-row b{color:var(--tx);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .row{display:flex;gap:6px;margin:10px 0 8px}
  button,select{flex:1;background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer}

  select{width:100%}
  select option{background:#1d1a16}

  .chks{display:flex;gap:14px}
  #fps{position:absolute;right:12px;bottom:10px;color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
  #ctrl{position:relative}
  #info{position:fixed;right:14px;top:14px;width:360px;max-height:calc(100% - 28px);overflow:auto;z-index:6}
  #info h2{font:600 17px/1.25 Georgia,serif;margin:0 26px 6px 0}
  #info .yr{color:var(--acc);font-weight:600;margin-bottom:8px}
  #info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0;font-size:12px}
  #info dt{color:var(--mut)}
  #info dd{margin:0}
  #info .tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:1px;border:1px solid var(--line);color:var(--mut)}
  #info .tag.ex{color:#9fd39b;border-color:#3d6b3a}
  #info .tag.ap{color:#e8c06a;border-color:#6b5524}
  #info p{margin:8px 0;color:#e6dccb}
  #info a{color:#e9c27a;word-break:break-all;font-size:11.5px}
  #info .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;flex:none;padding:0 4px}
  .lbl{pointer-events:auto;cursor:pointer;background:rgba(20,17,13,.78);color:#f6efe2;border:1px solid rgba(217,164,65,.55);padding:2px 7px;border-radius:999px;font:600 11px/1.3 ui-sans-serif,system-ui,sans-serif;white-space:nowrap;transition:background .15s}
  .lbl:hover{background:#d9a441;color:#1b140a}
  .lbl.gate{border-color:rgba(242,239,233,.6)}
  .lbl.gone{border-style:dashed;border-color:#d0675a;color:#ffd9d2}
  #walkHint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;text-align:center}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7);z-index:5;display:none}

  @media (max-width:700px){#ui{width:calc(100% - 28px)}#info{left:14px;right:14px;width:auto;top:auto;bottom:14px;max-height:50%}}

function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s ^= s<<13; s ^= s>>>17; s ^= s<<5; return (s>>>0)/4294967296; }; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// Acumulador de geometría no indexada (posición, normal, uv en metros)
class Geo{

  v(p,nr,u,v){ this.p.push(p[0],p[1],p[2]); this.n.push(nr[0],nr[1],nr[2]); this.u.push(u,v); }
  tri(a,b,c,na,nb,nc,ua,ub,uc){ this.v(a,na,ua[0],ua[1]); this.v(b,nb,ub[0],ub[1]); this.v(c,nc,uc[0],uc[1]); }

const WALK = { cell:25, map:new Map(), regions:[], land:[] };
function addRegion(poly, h, kind='wall'){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of poly){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const r={poly,h,kind,bb:[x0,y0,x1,y1]}; WALK.regions.push(r);
  for(let i=Math.floor(x0/WALK.cell);i<=Math.floor(x1/WALK.cell);i++) for(let j=Math.floor(y0/WALK.cell);j<=Math.floor(y1/WALK.cell);j++){ const k=i+','+j; if(!WALK.map.has(k)) WALK.map.set(k,[]); WALK.map.get(k).push(r); }
  return r;
}
function regionsNear(e,n){ return WALK.map.get(Math.floor(e/WALK.cell)+','+Math.floor(n/WALK.cell)) || []; }
let landHeight = (e,n)=>0;
function heightAt(e,n){
  let best=-Infinity, any=false;
  for(const r of regionsNear(e,n)){
    if(r.h===null) continue;
    if(e<r.bb[0]||e>r.bb[2]||n<r.bb[1]||n>r.bb[3]) continue;
    if(!pip(e,n,r.poly)) continue;
    const v = typeof r.h==='function' ? r.h(e,n) : r.h;
    if(v===Infinity) return Infinity;
    best=Math.max(best,v); any=true;
  }
  return any ? best : landHeight(e,n);
}
function rectBlocked(poly, pad){ // ¿choca un lote con alguna estructura?
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of poly){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  x0-=pad;y0-=pad;x1+=pad;y1+=pad;
  for(let i=Math.floor(x0/WALK.cell);i<=Math.floor(x1/WALK.cell);i++) for(let j=Math.floor(y0/WALK.cell);j<=Math.floor(y1/WALK.cell);j++){
    for(const r of (WALK.map.get(i+','+j)||[])){ if(r.kind==='house') continue; if(r.bb[0]<x1&&r.bb[2]>x0&&r.bb[1]<y1&&r.bb[3]>y0) return true; }
  }
  return false;
}

/* =====================================================================

   ===================================================================== */
function makeNoise(seed){
  const r=rng(seed), perm=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1)); [perm[i],perm[j]]=[perm[j],perm[i]];}
  const p=new Uint8Array(512); for(let i=0;i<512;i++) p[i]=perm[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10);
  const gr=(h,x,y)=>{switch(h&7){case 0:return x+y;case 1:return -x+y;case 2:return x-y;case 3:return -x-y;case 4:return x;case 5:return -x;case 6:return y;default:return -y;}};
  return (x,y,px,py)=>{ // tileable con periodos px, py (en celdas)
    let X=Math.floor(x),Y=Math.floor(y); x-=X; y-=Y;
    const X0=((X%px)+px)%px, X1=(X0+1)%px, Y0=((Y%py)+py)%py, Y1=(Y0+1)%py;
    const u=fade(x),v=fade(y);
    const a=gr(p[p[X0]+Y0],x,y), b=gr(p[p[X1]+Y0],x-1,y), c=gr(p[p[X0]+Y1],x,y-1), d=gr(p[p[X1]+Y1],x-1,y-1);
    return (a+(b-a)*u)+((c+(d-c)*u)-(a+(b-a)*u))*v;
  };
}
function fbm(nz,x,y,px,py,oct){ let s=0,a=0.5,f=1; for(let o=0;o<oct;o++){ s+=a*nz(x*f,y*f,px*f,py*f); a*=0.5; f*=2; } return s; }
function canvasTex(c, srgb, rx=1, ry=1){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace; t.repeat.set(rx,ry); t.anisotropy=8; t.generateMipmaps=true; t.needsUpdate=true; return t; }
function normalFromHeight(h,W,H,str){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); const im=g.createImageData(W,H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const l=h[y*W+((x-1+W)%W)], r=h[y*W+((x+1)%W)], u=h[((y-1+H)%H)*W+x], d=h[((y+1)%H)*W+x];
    let nx=-(r-l)*str, ny=(d-u)*str, nz=1; const L=Math.hypot(nx,ny,nz); nx/=L;ny/=L;nz/=L;
    const i=(y*W+x)*4; im.data[i]=(nx*0.5+0.5)*255; im.data[i+1]=(ny*0.5+0.5)*255; im.data[i+2]=(nz*0.5+0.5)*255; im.data[i+3]=255;
  }
  g.putImageData(im,0,0); return c;
}
// Piedra coralina: sillares 0.60 x 0.30 m (JSON materiales.textura), porosidad, juntas de cal
function stoneTextures(){
  const W=1024,H=512, PX=W/4.8;                     // tile = 4.8 m x 2.4 m
  const bw=0.60*PX, bh=0.30*PX;                       // JSON: bloques ~0.60 x 0.30 m
  const nz=makeNoise(7), nz2=makeNoise(19), r=rng(5);
  const C=hexRGB(COLX.piedra_coralina_limpia), M=hexRGB(COLX.piedra_meteorizada_media), J=hexRGB(COLX.blanco_cal_detalles);
  const tones=[]; for(let i=0;i<200;i++) tones.push(r());
  const hgt=new Float32Array(W*H);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); const im=g.createImageData(W,H);
  for(let y=0;y<H;y++){ const row=Math.floor(y/bh), ly=y-row*bh, off=(row%2)*bw*0.5;
    for(let x=0;x<W;x++){
      const xx=(x+off)%W, col=Math.floor(xx/bw), lx=xx-col*bw;
      const d=Math.min(lx,bw-lx,ly,bh-ly);
      const tone=tones[(row*9+col)%200];
      const n1=fbm(nz,x/W*12,y/H*6,12,6,3);
      const pore=nz2(x/W*170,y/H*85,170,85)*0.6+nz2(x/W*60,y/H*30,60,30)*0.5;
      const pit=sstep(0.28,0.5,pore);
      const joint = d<2.4 ? 1 : 0, bev=sstep(2.4,9,d);
      let k=clamp(tone*0.75+n1*0.9+0.1,0,1);
      let R=lerp(C[0],M[0],k), G=lerp(C[1],M[1],k), B=lerp(C[2],M[2],k);
      const dark=1-pit*0.5-(1-bev)*0.12;
      R*=dark;G*=dark;B*=dark;
      if(joint){ R=J[0]*0.72;G=J[1]*0.70;B=J[2]*0.64; }
      const i=(y*W+x)*4; im.data[i]=R; im.data[i+1]=G; im.data[i+2]=B; im.data[i+3]=255;
      hgt[y*W+x] = joint ? 0.1 : (0.55+0.45*bev) - pit*0.45 + n1*0.12;
    }}
  g.putImageData(im,0,0);
  return { map: canvasTex(c,true,1/4.8,1/2.4), normal: canvasTex(normalFromHeight(hgt,W,H,2.2),false,1/4.8,1/2.4) };
}
// Empedrado de adarves, plataformas y rampas
function paveTextures(){
  const W=512, S=3.2, PX=W/S, cs=0.22*PX; const n=Math.round(W/cs); const csz=W/n;
  const r=rng(31), pts=[]; for(let j=0;j<n;j++) for(let i=0;i<n;i++) pts.push([ (i+0.2+0.6*r())*csz, (j+0.2+0.6*r())*csz, r() ]);
  const nz=makeNoise(41); const hgt=new Float32Array(W*W);
  const c=document.createElement('canvas'); c.width=c.height=W; const g=c.getContext('2d'); const im=g.createImageData(W,W);
  const A=hexRGB(COLX.piedra_coralina_limpia), B=hexRGB(COLX.piedra_meteorizada_media);
  for(let y=0;y<W;y++) for(let x=0;x<W;x++){
    const ci=Math.floor(x/csz), cj=Math.floor(y/csz); let d1=1e9,d2=1e9,best=null;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ const ii=(ci+di+n)%n, jj=(cj+dj+n)%n; const p=pts[jj*n+ii]; const px=p[0]+(ci+di-ii)*csz, py=p[1]+(cj+dj-jj)*csz; const d=Math.hypot(x-px,y-py); if(d<d1){d2=d1;d1=d;best=p;} else if(d<d2) d2=d; }
    const edge=d2-d1, k=clamp(best[2]*0.8+fbm(nz,x/W*8,y/W*8,8,8,2)*0.6,0,1);
    const m=sstep(1.5,6,edge);
    const i=(y*W+x)*4; const sh=0.62+0.38*m;
    im.data[i]=lerp(A[0],B[0],k)*sh*0.92; im.data[i+1]=lerp(A[1],B[1],k)*sh*0.9; im.data[i+2]=lerp(A[2],B[2],k)*sh*0.86; im.data[i+3]=255;
    hgt[y*W+x]=m*(0.7+0.3*(1-d1/csz));
  }
  g.putImageData(im,0,0);
  return { map: canvasTex(c,true,1/S,1/S), normal: canvasTex(normalFromHeight(hgt,W,W,1.6),false,1/S,1/S) };
}

function arcadeShape(W,Hh,arcs){ // contorno único: vanos de medio punto que llegan al suelo (sin agujeros)

  { let a=door; for(const s of sl){ seg(a,s-slit,0.95,1.75); a=s+slit; } seg(a,Math.PI*2-door,0.95,1.75); }
  const fl=new THREE.CircleGeometry(R-0.02,24); fl.rotateX(-Math.PI/2); fl.translate(0,0.02,0); parts.push(fl);

  const mats={ stone:stoneMat(), pave:new THREE.MeshStandardMaterial({map:TEX.pave.map,normalMap:TEX.pave.normal,roughness:0.95}), ocre:stuccoMat(COLX.ocre_amarillo_colonial_bovedas_y_reloj), cal:STUFF.matCal,
    dark:new THREE.MeshStandardMaterial({color:0x14110e,roughness:1}), iron:new THREE.MeshStandardMaterial({color:0x2a2a2c,roughness:0.45,metalness:0.7}), wood:new THREE.MeshStandardMaterial({color:0x5b3b22,roughness:0.85}),
    tile:new THREE.MeshStandardMaterial({map:TEX.tile,roughness:0.8}), ground:new THREE.MeshStandardMaterial({map:TEX.ground,roughness:1}), grass:new THREE.MeshStandardMaterial({map:TEX.ground,color:0x9fae72,roughness:1}), street:new THREE.MeshStandardMaterial({map:TEX.pave.map,color:0xe2dccf,roughness:0.95}), asphalt:new THREE.MeshStandardMaterial({color:0x77746f,roughness:0.9}), vault:null };
  STUFF.mats=mats;
  for(const k in BUCKET){ const b=BUCKET[k]; const gs=[...b.list]; if(b.geo.p.length) gs.push(b.geo.geometry()); if(!gs.length||!mats[k]) continue;
    const g=mergeGeometries(gs); g.computeBoundingSphere(); const m=new THREE.Mesh(g,mats[k]); m.castShadow=!['ground','grass','street','asphalt','dark'].includes(k); m.receiveShadow=true; scene.add(m); }
  // interiores de bóvedas
  const vm=new THREE.InstancedMesh(STUFF.vaultGeo, stuccoMat('#b98d3c'), VAULTS.length); VAULTS.forEach((m,i)=>vm.setMatrixAt(i,m)); vm.material.side=THREE.DoubleSide; vm.receiveShadow=true; scene.add(vm);
  // garitas
  const gg=buildSentryBox(); const gm=new THREE.InstancedMesh(gg, stoneMat({side:THREE.DoubleSide}), INST.garitas.length); const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1);
  INST.garitas.forEach((g,i)=>{ q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(g.de,-g.dn)); m4.compose(new THREE.Vector3(g.e,g.y,-g.n),q,sc); gm.setMatrixAt(i,m4); }); gm.castShadow=gm.receiveShadow=true; scene.add(gm);
  // cañones
  const cg=buildCannon(); const ci=new THREE.InstancedMesh(cg.iron, mats.iron, INST.cannons.length), cw=new THREE.InstancedMesh(cg.wood, mats.wood, INST.cannons.length);
  INST.cannons.forEach((c,i)=>{ q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(c.de,-c.dn)); m4.compose(new THREE.Vector3(c.e,c.y,-c.n),q,sc); ci.setMatrixAt(i,m4); cw.setMatrixAt(i,m4); });
  ci.castShadow=cw.castShadow=true; scene.add(ci,cw);
  // faroles + charcos de luz
  STUFF.lampMat=new THREE.MeshStandardMaterial({color:0x2b241c,emissive:0xffb15a,emissiveIntensity:0}); const post=mergeGeometries([clean(T(new THREE.CylinderGeometry(0.07,0.11,3.4,8),0,1.7,0)), clean(T(new THREE.CylinderGeometry(0.2,0.2,0.18,8),0,0.09,0))]);
  const lant=clean(T(new THREE.CylinderGeometry(0.22,0.14,0.5,6),0,3.62,0));
  const lp=new THREE.InstancedMesh(post, mats.iron, INST.lamps.length), ll=new THREE.InstancedMesh(lant, STUFF.lampMat, INST.lamps.length);
  STUFF.poolMat=new THREE.MeshBasicMaterial({map:glowTexture(),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0,fog:false});
  const pg=new THREE.PlaneGeometry(14,14); pg.rotateX(-Math.PI/2); const pl=new THREE.InstancedMesh(pg, STUFF.poolMat, INST.lamps.length);
  INST.lamps.forEach((l,i)=>{ m4.makeTranslation(l.e,l.y,-l.n); lp.setMatrixAt(i,m4); ll.setMatrixAt(i,m4); m4.makeTranslation(l.e,l.y+0.06,-l.n); pl.setMatrixAt(i,m4); });
  lp.castShadow=true; pl.renderOrder=2; scene.add(lp,ll,pl);
  // trazos punteados (tramos demolidos)
  const dg=new THREE.PlaneGeometry(4.5,1.1); dg.rotateX(-Math.PI/2); const dm=new THREE.InstancedMesh(dg,new THREE.MeshBasicMaterial({color:0xd0675a,transparent:true,opacity:0.9}),DASH.length);
  DASH.forEach((d,i)=>{ q.setFromAxisAngle(new THREE.Vector3(0,1,0), d.ang); m4.compose(new THREE.Vector3(d.e,0.08,-d.n),q,sc); dm.setMatrixAt(i,m4); }); scene.add(dm);
  // escolleras
  const rk=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1,0), stoneMat(), STUFF.rocks.length); const e3=new THREE.Euler();
  STUFF.rocks.forEach((r,i)=>{ q.setFromEuler(e3.set(r.rx,r.ry,0)); m4.compose(new THREE.Vector3(r.e,WATER_Y+0.1,-r.n),q,new THREE.Vector3(r.s,r.s*0.7,r.s)); rk.setMatrixAt(i,m4); }); rk.receiveShadow=true; scene.add(rk);
  // ciudad
  const hb=new THREE.BoxGeometry(1,1,1); hb.translate(0,0.5,0); const hm=new THREE.InstancedMesh(hb, houseMat(), HOUSES.length);
  HOUSES.forEach((h,i)=>{ q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(h.fn,h.fe)); m4.compose(new THREE.Vector3(h.e,0,-h.n),q,new THREE.Vector3(h.w,h.h,h.d)); hm.setMatrixAt(i,m4); hm.setColorAt(i,h.c); });
  hm.castShadow=hm.receiveShadow=true; scene.add(hm);
  const rg=gableGeo(); const rm=new THREE.InstancedMesh(rg, roofMat(), ROOFS.length);
  ROOFS.forEach((h,i)=>{ q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(h.fn,h.fe)); m4.compose(new THREE.Vector3(h.e,h.y,-h.n),q,new THREE.Vector3(h.w,h.h,h.d)); rm.setMatrixAt(i,m4); rm.setColorAt(i,h.c); });
  rm.castShadow=rm.receiveShadow=true; scene.add(rm);
  const bgeo=new THREE.BoxGeometry(1,1.1,0.9); bgeo.translate(0,0.55,0.45); const bm=new THREE.InstancedMesh(bgeo, mats.wood, Math.max(1,BALC.length)); let bi=0;
  BALC.forEach(b=>{ q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.atan2(b.fn,b.fe)); const off=new THREE.Vector3(0,0,b.off).applyQuaternion(q);
      m4.compose(new THREE.Vector3(b.e,b.y,-b.n).add(off),q,new THREE.Vector3(b.w,1,1)); bm.setMatrixAt(bi++,m4); }); bm.count=bi; bm.castShadow=true; scene.add(bm);
  buildSea(); setupLabels();
}
function gableGeo(){ // tejado a dos aguas unitario (cumbrera a lo largo de X)
  const G=new Geo(); const a=[-0.5,0,-0.5],b=[0.5,0,-0.5],c=[0.5,0,0.5],d=[-0.5,0,0.5],e=[-0.5,1,0],f=[0.5,1,0];
  const F=(p,q,r)=>{ const n=new THREE.Vector3().crossVectors(new THREE.Vector3(q[0]-p[0],q[1]-p[1],q[2]-p[2]),new THREE.Vector3(r[0]-p[0],r[1]-p[1],r[2]-p[2])).normalize(); const nn=[n.x,n.y,n.z]; G.tri(p,q,r,nn,nn,nn,[p[0],p[1]],[q[0],q[1]],[r[0],r[1]]); };
  F(a,e,b); F(b,e,f); F(d,c,f); F(d,f,e); F(a,d,e); F(b,f,c);
  return G.geometry();
}

/* =====================================================================
   setupUI: etiquetas, panel de información, controles, recorrido
   ===================================================================== */
const LABEL_OBJS=[];
function infoFor(id){
  const dash='<span class="tag">no consta en el JSON</span>';
  const cls=c=>c==='EXACTO'?'<span class="tag ex">EXACTO</span>':c?`<span class="tag ap">${c}</span>`:'';
  const item=[...CHAIN_A,...CHAIN_B].find(i=>i.id===id);
  const YEARS={ sdomingo:'1614 — inicio de la construcción (cronología)', scatalina:'1608–1631 — Cristóbal de Roda (ingenieros)', slucas:'1608–1631 — Cristóbal de Roda (ingenieros)',
    sclara:'1742 — reconstrucción (detalles)', merced:'1708–1732 — reconstrucción de Herrera y Sotomayor (detalles/ingenieros)', steresa:'1631 · restaurado y terraplenado en 1732',
    chambacu:'1631 — Francisco de Murga', sbarbara:'1631 — Francisco de Murga', sjose:'1631 — Francisco de Murga', reducto:'1631 — Francisco de Murga',
    tenaza:'1765–1771 — Antonio de Arévalo (cronología)', reloj:'Portada: desde 1714 (Herrera y Sotomayor) · Torre: 1888', paz:'1905 (cronología)', medialuna:'1631 · demolida en 1893',
    bovedas:'1789–1798 (conflicto en el JSON: la ETCAR da 1792–1798)', matuna:'Demolido entre 1880 y 1924', santiago:null, sfj:null, signacio:null, sje:null, scruz:null, spm:null, pdomingo:null, pcatalina:null, castillo:null };
  let h=`<button class="x" title="Cerrar">×</button><h2>${NAMES[id]}</h2><div class="yr">${YEARS[id]||'Año: no consta en el JSON'}</div>`;
  const src=u=>u?`<p><a href="${u}" target="_blank" rel="noopener">${u}</a></p>`:'';
  if(item && item.data || id==='tenaza'){ const b= id==='tenaza'? bd('Tenaza') : item.data;
    let area=b.area_m2; let areaTxt=`${area.valor.toLocaleString('es')} m² ${cls(area.clasificacion)}`;
    if(item && item.area) areaTxt=`${item.area} m² ${cls('EXACTO')} <span class="tag">nota del grupo</span>`; else if(b.nombre.startsWith('Otros')) areaTxt='no consta para este baluarte '+dash;
    const g=b.geometria_planta;
    h+=`<dl><dt>Forma</dt><dd>${b.forma}${item&&item.vacio?' (baluarte vacío)':''}</dd><dt>Área</dt><dd>${areaTxt}</dd><dt>Altura</dt><dd>${b.altura_m.valor} m ${cls(b.altura_m.clasificacion)}</dd>
      <dt>Caras</dt><dd>${g.longitud_caras_m.valor} m ${cls(g.longitud_caras_m.clasificacion)}</dd><dt>Flancos</dt><dd>${g.longitud_flancos_m.valor} m ${cls(g.longitud_flancos_m.clasificacion)}</dd><dt>Gola</dt><dd>${g.ancho_gola_m.valor} m ${cls(g.ancho_gola_m.clasificacion)}</dd></dl>
      <p>${b.detalles}</p>${src(b.fuente)}`;
  } else if(['reloj','pdomingo','pcatalina','paz','medialuna'].includes(id)){
    const key={reloj:'Reloj',pdomingo:'Santo Domingo',pcatalina:'Santa Catalina',paz:'Paz y la Concordia',medialuna:'Media Luna'}[id]; const p=DATA.puertas.find(x=>x.nombre.includes(key));
    h+=`<p><b>Ubicación.</b> ${p.ubicacion}</p><p>${p.arquitectura}</p>`;
    if(p.dimensiones_modelado){ const d=p.dimensiones_modelado; h+=`<dl><dt>Altura total</dt><dd>${d.altura_total_torre_m.valor} m ${cls(d.altura_total_torre_m.clasificacion)}</dd><dt>Ancho portada</dt><dd>${d.ancho_portada_m.valor} m ${cls(d.ancho_portada_m.clasificacion)}</dd><dt>Fondo túnel</dt><dd>${d.fondo_tunel_m.valor} m ${cls(d.fondo_tunel_m.clasificacion)}</dd></dl>`; }
    h+=src(p.fuente);
  } else if(id==='bovedas'){ const b=BOV, d=b.dimensiones_modelado;
    h+=`<p>${b.nombre_oficial}. Ingeniero: ${b.ingeniero}. ${b.ubicacion}.</p><dl><dt>Bóvedas</dt><dd>${b.numero_bovedas.valor} ${cls('EXACTO')}</dd><dt>Arcos</dt><dd>${b.numero_arcos_portada.valor} ${cls('EXACTO')}</dd><dt>Plataforma</dt><dd>${b.area_plataforma_m2.valor} m² ${cls('EXACTO')}</dd><dt>Largo</dt><dd>${d.largo_total_m.valor} m ${cls(d.largo_total_m.clasificacion)}</dd><dt>Fachada</dt><dd>${d.altura_fachada_m.valor} m ${cls(d.altura_fachada_m.clasificacion)}</dd></dl><p>${b.arquitectura_y_funcion}</p>${b.fuentes.map(src).join('')}`;
  } else if(id==='matuna'){ const p=DATA.trazado.puntos_en_orden.find(x=>x.estado==='desaparecido'&&x.nombre.includes('Matuna')); h+=`<p>${p.nombre}</p><p>${p.nota}</p>${src(p.fuente)}`; }
  else if(id==='castillo'){ h+=`<p>${DATA.contexto_paisaje}</p><p><span class="tag ap">APROXIMADO</span> Solo silueta: el JSON no trae geometría del castillo; se ubica a 1,25 km al SE de Santa Catalina como indica el JSON.</p>`; }
  return h;
}
function setupLabels(){
  for(const L of INST.labels){ const el=document.createElement('div'); el.className='lbl'+(L.gate?' gate':'')+(L.gone?' gone':''); el.textContent=NAMES[L.id]||L.id;
    el.addEventListener('pointerdown',ev=>{ev.stopPropagation(); showInfo(L.id);});
    const o=new CSS2DObject(el); o.position.set(L.e,L.y,-L.n); scene.add(o); LABEL_OBJS.push(o); }
}
const info=document.getElementById('info');
function showInfo(id){ info.innerHTML=infoFor(id); info.hidden=false; info.querySelector('.x').onclick=()=>info.hidden=true; }
const VIEWS={};
function setupUI(){
  const B=BASTIONS; const at=(o,dE,dN,h,ty=0)=>({t:new THREE.Vector3(o.e,ty,-o.n), c:new THREE.Vector3(o.e+dE,h,-(o.n+dN))});
  VIEWS.general=at({e:60,n:420},-900,700,620,0); VIEWS.reloj=at(STUFF.reloj,-35,-70,28,10); VIEWS.bovedas=at(STUFF.bovedas,-30,-120,40,6);
  VIEWS.catalina=at(B.scatalina,-170,140,70,8); VIEWS.lucas=at(B.slucas,160,-40,45,6); VIEWS.domingo=at(B.sdomingo,-150,60,45,6);
  VIEWS.getsemani=at({e:420,n:-200},380,-260,230,0); VIEWS.matuna=at(STUFF.matuna,220,-160,180,0); VIEWS.castillo=at(CASTILLO,-420,320,160,30);
  const hour=document.getElementById('hour'); hour.oninput=()=>setTime(+hour.value); setTime(+hour.value);
  document.getElementById('goto').onchange=e=>{ const v=e.target.value; if(VIEWS[v]){ if(UIState.mode==='walk') exitWalk(); flyTo(VIEWS[v]); } e.target.value=''; };
  document.getElementById('cLabels').onchange=e=>{ UIState.labels=e.target.checked; labelR.domElement.style.display=UIState.labels?'':'none'; };
  document.getElementById('cShadows').onchange=e=>{ UIState.shadows=e.target.checked; setTime(+hour.value); };
  document.getElementById('bOrbit').onclick=()=>exitWalk();
  document.getElementById('bWalk').onclick=()=>enterWalk();
  renderer.domElement.addEventListener('click',()=>{ if(UIState.mode==='walk' && !fpc.isLocked) fpc.lock(); });
  fpc.addEventListener('lock',()=>{ document.getElementById('cross').style.display='block'; });
  fpc.addEventListener('unlock',()=>{ document.getElementById('cross').style.display='none'; });
  addEventListener('keydown',e=>{ KEYS[e.code]=true; }); addEventListener('keyup',e=>{ KEYS[e.code]=false; });
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelR.setSize(innerWidth,innerHeight); });
  camera.position.copy(new THREE.Vector3(STUFF.bovedas.e-260, 95, -(STUFF.bovedas.n+260))); orbit.target.set(STUFF.bovedas.e+40, 4, -(STUFF.bovedas.n-40)); orbit.update();
}
let FLY=null;
function flyTo(v){ FLY={t0:performance.now(), c0:camera.position.clone(), t0v:orbit.target.clone(), c1:v.c, t1:v.t}; }
const KEYS={}; const WALKER={e:0,n:0,y:0};
function enterWalk(){
  UIState.mode='walk'; orbit.enabled=false; document.getElementById('bWalk').classList.add('on'); document.getElementById('bOrbit').classList.remove('on'); document.getElementById('walkHint').hidden=false;
  const s=STUFF.walkStart; WALKER.e=s.e; WALKER.n=s.n; WALKER.y=heightAt(s.e,s.n); if(!isFinite(WALKER.y)) WALKER.y=8.5;
  camera.position.set(WALKER.e, WALKER.y+EYE, -WALKER.n); camera.lookAt(WALKER.e+s.dir[0]*10, WALKER.y+EYE, -(WALKER.n+s.dir[1]*10));
  try{ fpc.lock(); }catch(e){}
}
function exitWalk(){ if(UIState.mode!=='walk') return; if(fpc.isLocked) fpc.unlock(); UIState.mode='orbit'; orbit.enabled=true; document.getElementById('bWalk').classList.remove('on'); document.getElementById('bOrbit').classList.add('on'); document.getElementById('walkHint').hidden=true;
  const d=new THREE.Vector3(); camera.getWorldDirection(d); orbit.target.copy(camera.position).addScaledVector(d,30); orbit.target.y=Math.max(0,orbit.target.y-5); camera.position.y+=20; camera.position.addScaledVector(d,-30); orbit.update(); }
function walkStep(dt){
  const sp=(KEYS.ShiftLeft||KEYS.ShiftRight)?7.5:3.2; let f=0,s=0; if(KEYS.KeyW||KEYS.ArrowUp)f+=1; if(KEYS.KeyS||KEYS.ArrowDown)f-=1; if(KEYS.KeyD||KEYS.ArrowRight)s+=1; if(KEYS.KeyA||KEYS.ArrowLeft)s-=1;
  if(f||s){ const d=new THREE.Vector3(); camera.getWorldDirection(d); d.y=0; d.normalize(); const r=new THREE.Vector3(-d.z,0,d.x);
    const mv=d.multiplyScalar(f).add(r.multiplyScalar(s)).normalize().multiplyScalar(sp*dt);
    const tryMove=(de,dn)=>{ const ne=WALKER.e+de, nn=WALKER.n+dn; const h=heightAt(ne,nn); if(isFinite(h) && Math.abs(h-WALKER.y)<0.62){ WALKER.e=ne; WALKER.n=nn; WALKER.y=h; return true;} return false; };
    if(!tryMove(mv.x,-mv.z)){ tryMove(mv.x,0) || tryMove(0,-mv.z); } }
  camera.position.x=WALKER.e; camera.position.z=-WALKER.n; camera.position.y=lerp(camera.position.y, WALKER.y+EYE, Math.min(1,dt*12));
}

/* =====================================================================
   BUCLE
   ===================================================================== */
const clock=new THREE.Clock(); let fc=0, ft=0; const fpsEl=document.getElementById('fps');
function loop(){
  const dt=Math.min(0.05,clock.getDelta()); U.time.value+=dt;
  if(FLY){ const k=Math.min(1,(performance.now()-FLY.t0)/1600), e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2; camera.position.lerpVectors(FLY.c0,FLY.c1,e); orbit.target.lerpVectors(FLY.t0v,FLY.t1,e); if(k>=1) FLY=null; }
  if(UIState.mode==='walk') walkStep(dt); else orbit.update();
  // sombra que sigue al punto de interés
  const tgt = UIState.mode==='walk' ? camera.position : orbit.target; const dist=UIState.mode==='walk'?60:Math.min(600,camera.position.distanceTo(orbit.target));
  const ext=clamp(dist*0.9,120,420); const sc=sun.shadow.camera; if(Math.abs(sc.right-ext)>20){ sc.left=-ext; sc.right=ext; sc.top=ext; sc.bottom=-ext; sc.updateProjectionMatrix(); }
  const snap=ext*2/2048; const tx=Math.round(tgt.x/snap)*snap, tz=Math.round(tgt.z/snap)*snap;
  sun.target.position.set(tx,0,tz); sun.position.set(tx,0,tz).addScaledVector(SUNSTATE.dir,1200);
  renderer.render(scene,camera); if(UIState.labels) labelR.render(scene,camera);
  fc++; ft+=dt; if(ft>0.5){ fpsEl.textContent=Math.round(fc/ft)+' fps'; fc=0; ft=0; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(()=>{ try{ build(); setupUI(); document.getElementById('loading').remove(); window.__ready=true; loop(); } catch(e){ console.error(e); document.getElementById('loading').textContent='Error: '+e.message; window.__err=e.stack; } });
